[project]
name = "home-library"
version = "0.1.0"
description = "Catalog a family's children's books from phone photos read by a vision LLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",
]

[project.scripts]
hl = "home_library.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/home_library"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pinned, so that a check does not depend on Ruff's defaults or on a user's own configuration.
select = ["E", "F", "I"]
ignore = ["E501"]  # long lines are test data
